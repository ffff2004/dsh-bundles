name: Test bundles and publish plugin market

on:
  pull_request:
  workflow_dispatch:
    inputs:
      validation-sha:
        description: Expected branch SHA for bot-created Release PR validation
        type: string
        required: false
  workflow_call:
    inputs:
      release-ref:
        description: Immutable release commit already tagged by release.yml
        type: string
        required: true
      release-tags:
        description: JSON array of all tags in this release batch
        type: string
        required: true

permissions:
  contents: read

# Publish calls share one queue; PR checks cannot cancel a deployment.
concurrency:
  group: plugin-market-${{ github.event.pull_request.number || inputs.validation-sha || (inputs.release-ref && 'publish') || github.ref }}
  cancel-in-progress: false

env:
  # The adapter deliberately fails closed when this upstream revision changes.
  DSH_REF: 687f282e8625c6b8d11ff58211a90524be2e4317

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      checkout-ref: ${{ steps.ref.outputs.checkout-ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release-ref || github.sha }}
          persist-credentials: false
      - name: Validate immutable workflow inputs
        id: ref
        env:
          VALIDATION_SHA: ${{ inputs.validation-sha }}
          RELEASE_REF: ${{ inputs.release-ref }}
          RELEASE_TAGS: ${{ inputs.release-tags }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          import { parseReleaseTag } from './scripts/market-policy.mjs';
          const { VALIDATION_SHA, RELEASE_REF, RELEASE_TAGS, GITHUB_SHA, GITHUB_REF, GITHUB_OUTPUT } = process.env;
          if (VALIDATION_SHA && VALIDATION_SHA !== GITHUB_SHA) throw new Error('Release PR branch moved; dispatch validation again');
          if (RELEASE_REF) {
            if (GITHUB_REF !== 'refs/heads/main' || !/^[a-f0-9]{40}$/.test(RELEASE_REF)) throw new Error('Release calls require main and a full commit SHA');
            const tags = JSON.parse(RELEASE_TAGS);
            if (!Array.isArray(tags) || tags.length === 0 || tags.some(tag => typeof tag !== 'string' || !parseReleaseTag(tag))) throw new Error('Release call requires its complete tag batch');
          }
          appendFileSync(GITHUB_OUTPUT, `checkout-ref=${RELEASE_REF || GITHUB_SHA}\n`);
          JS

  test:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.checkout-ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test:lint
      - run: pnpm test:release
      - run: pnpm -r test

  market:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.checkout-ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the reference generator
        uses: actions/checkout@v7
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ env.DSH_REF }}
          path: .dsh-source
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: .dsh-source/package.json
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: .dsh-source/pnpm-lock.yaml
      - name: Install generator dependencies only
        working-directory: .dsh-source
        run: pnpm --filter '@deepseek-ai/dsh-plugin-market-generator...' install --frozen-lockfile --ignore-scripts
      - name: Test the adapter against the real pinned generator
        env:
          MARKET_GENERATOR_CHECKOUT: ${{ github.workspace }}/.dsh-source
        run: node --test scripts/market*.test.mjs
      - name: Apply the pinned tags-only adapter
        run: node scripts/prepare-market-generator.mjs --checkout .dsh-source
      - name: Create temporary source list
        run: printf '%s/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/plugin-market-sources.txt"
      - uses: actions/cache@v6
        with:
          path: .plugin-market-cache
          key: plugin-market-tags-only-v1-${{ runner.os }}-${{ github.repository }}-${{ env.DSH_REF }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            plugin-market-tags-only-v1-${{ runner.os }}-${{ github.repository }}-${{ env.DSH_REF }}-
      - name: Generate tags-only index and icons
        working-directory: .dsh-source
        run: |
          pnpm --filter @deepseek-ai/dsh-plugin-market-generator start \
            --input "$RUNNER_TEMP/plugin-market-sources.txt" \
            --output "$GITHUB_WORKSPACE/_site/index.json" \
            --cache "$GITHUB_WORKSPACE/.plugin-market-cache" \
            --title 'ffff2004 DSH Bundles' \
            --description 'Personal DeepSeek Harness bundles by ffff2004'
      - name: Verify every indexed version and the complete release batch
        env:
          RELEASE_TAGS: ${{ inputs.release-tags || '[]' }}
          RELEASE_REF: ${{ inputs.release-ref }}
        run: |
          node --input-type=module -e 'import { writeFileSync } from "node:fs"; writeFileSync(process.env.RUNNER_TEMP + "/release-tags.json", JSON.stringify(JSON.parse(process.env.RELEASE_TAGS)))'
          mode=pr-bootstrap
          if [ -n "$RELEASE_REF" ]; then mode=deploy; fi
          args=(
            --index _site/index.json --repo .
            --source-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
            --mode "$mode" --expect-tags-file "$RUNNER_TEMP/release-tags.json"
          )
          if [ -n "$RELEASE_REF" ]; then args+=(--release-ref "$RELEASE_REF"); fi
          node scripts/market-verify.mjs "${args[@]}"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: inputs.release-ref != '' && github.ref == 'refs/heads/main'
    needs: [market, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
