name: Validate bundles and strict market

on:
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || '' }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test:lint
      - run: pnpm test:release
      - run: pnpm test:market
      - run: pnpm -r test
      - uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 687f282e8625c6b8d11ff58211a90524be2e4317
          path: .dsh-source
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: .dsh-source/package.json
          run_install: false
      - name: Install pinned generator dependencies
        working-directory: .dsh-source
        run: pnpm --filter '@deepseek-ai/dsh-plugin-market-generator...' install --frozen-lockfile --ignore-scripts
      - run: pnpm test:market:integration --upstream "$GITHUB_WORKSPACE/.dsh-source"
      - name: Validate remote market (first boot may have no eligible tags; never deployed)
        run: |
          printf '%s/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/plugin-market-sources.txt"
          node scripts/market.mjs generate --upstream .dsh-source \
            --input "$RUNNER_TEMP/plugin-market-sources.txt" --output _site/index.json \
            --cache .plugin-market-cache --allow-empty
